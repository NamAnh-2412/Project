spring.application.name=vexemphim-api
server.port=8080
server.servlet.encoding.charset=UTF-8

# MySQL (SOS04). Tạo schema nếu chưa có.
spring.datasource.url=jdbc:mysql://localhost:3306/vexemphim?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=241205
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=vexemphim-btl-jwt-secret-key-32bytes-min
jwt.expiration-ms=86400000

app.api.key=SECRET_KEY_BTL
app.hold-minutes=8
app.vip-multiplier=1.2
app.upload-dir=uploads

spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.data.web.pageable.default-page-size=8
spring.data.web.pageable.max-page-size=50

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
