spring.application.name=vexemphim-api
server.port=8080
server.servlet.encoding.charset=UTF-8

# MySQL (SOS04). Tạo schema nếu chưa có.
spring.datasource.url=jdbc:mysql://localhost:3306/vexemphim?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=241205
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=vexemphim-btl-jwt-secret-key-32bytes-min
jwt.expiration-ms=86400000

app.api.key=SECRET_KEY_BTL
app.hold-minutes=8
app.cancel-before-minutes=30
app.payment-wait-minutes=10

# PayOS sandbox. Để trống thì nút chuyển khoản báo chưa cấu hình; thanh toán giả lập vẫn chạy.
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=http://localhost:5173/tickets
payos.cancel-url=http://localhost:5173/

# MoMo sandbox. Để trống khóa thì thanh toán online vẫn dùng QR giả lập.
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/api/payments/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
app.web-base-url=${WEB_BASE_URL:http://localhost:5173}

# SMTP Gmail. Vé online gửi sau khi thanh toán. Mật khẩu là mật khẩu ứng dụng, không có dấu cách.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:namanhnguyen241205rs@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:CineVe <namanhnguyen241205rs@gmail.com>}
app.vip-multiplier=1.2
app.upload-dir=uploads

spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.data.web.pageable.default-page-size=8
spring.data.web.pageable.max-page-size=50

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
