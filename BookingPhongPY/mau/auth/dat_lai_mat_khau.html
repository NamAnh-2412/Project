{% extends 'base.html' %}
{% block title %}Đặt lại mật khẩu{% endblock %}
{% block header %}{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-form">
        <h2>Đặt lại mật khẩu</h2>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group"><label>Mật khẩu mới</label><input type="password" name="password" required></div>
            <div class="form-group"><label>Nhập lại</label><input type="password" name="confirm_password" required></div>
            <button class="btn btn-primary" type="submit">Lưu mật khẩu</button>
        </form>
    </div>
</div>
{% endblock %}
