{% extends 'base.html' %}
{% block title %}Thống kê - Chủ nhà{% endblock %}

{% block content %}
<div class="container">
    <h1>📊 Thống kê của bạn</h1>
    <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0;">
        <div style="background: white; padding: 20px; border-radius: 10px; border-left: 4px solid #3498db;">
            <h3 style="margin: 0 0 10px 0; color: #666;">Tổng số phòng</h3>
            <p style="font-size: 2em; margin: 0;">{{ stats.total_rooms }}</p>
        </div>
        <div style="background: white; padding: 20px; border-radius: 10px; border-left: 4px solid #27ae60;">
            <h3 style="margin: 0 0 10px 0; color: #666;">Phòng còn trống</h3>
            <p style="font-size: 2em; margin: 0;">{{ stats.available_rooms }}</p>
        </div>
        <div style="background: white; padding: 20px; border-radius: 10px; border-left: 4px solid #f39c12;">
            <h3 style="margin: 0 0 10px 0; color: #666;">Phòng đã thuê</h3>
            <p style="font-size: 2em; margin: 0;">{{ stats.rented_rooms }}</p>
        </div>
    </div>
    <a href="{{ url_for('admin.manage_rooms') }}" class="btn btn-primary">Đăng phòng</a>
    <a href="{{ url_for('admin.chu_nha_bookings') }}" class="btn btn-secondary">Đơn đặt phòng</a>
</div>
{% endblock %}
