{% extends 'base.html' %}
{% block title %}Hồ sơ{% endblock %}
{% block content %}
<div class="container">
    <h1>Hồ sơ</h1>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    {% if user.anh_dai_dien %}<img src="{{ image_url(user.anh_dai_dien) }}" alt="" width="96">{% endif %}
    <p>{% if user.is_verified %}Chủ nhà đã xác minh{% else %}Chưa xác minh danh tính{% endif %}</p>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label>Họ tên</label><input name="ho_ten" value="{{ user.ho_ten or '' }}" required></div>
        <div class="form-group"><label>Email</label><input value="{{ user.email }}" disabled></div>
        <div class="form-group"><label>Số điện thoại</label><input name="so_dien_thoai" value="{{ user.so_dien_thoai or '' }}"></div>
        <div class="form-group"><label>Số CCCD</label><input name="cccd_so" value="{{ user.cccd_so or '' }}"></div>
        <div class="form-group"><label>Ảnh đại diện</label><input type="file" name="anh_dai_dien" accept="image/*"></div>
        <div class="form-group"><label>Mật khẩu hiện tại (khi đổi mật khẩu)</label><input type="password" name="mat_khau_cu"></div>
        <div class="form-group"><label>Mật khẩu mới</label><input type="password" name="mat_khau_moi"></div>
        <button class="btn btn-primary" type="submit">Lưu</button>
    </form>
</div>
{% endblock %}
